# Configuración del broker (04 ADR-03, RNF-16). Se monta en /etc/rabbitmq/conf.d/.

# Tamaño máximo de mensaje = communication.limits.max_frame_bytes (4 MiB)
max_message_size = 4194304

# Límite de memoria del broker. Al superarlo, RabbitMQ bloquea a los publicadores (no hay OOM).
# En la 6.ª Pi se recalibra (R-03): el broker comparte 4 GB con el servidor, la raíz o el coordinador.
vm_memory_high_watermark.absolute = 512MiB

# Detección de conexiones muertas (segundos)
heartbeat = 30

# Sin acceso del usuario 'guest' (el aprovisionamiento crea usuarios por nodo)
loopback_users.guest = true

# TLS (perfiles S1/S2, E10). Certificados de scripts/provision_identities.py tls (docker/tls/, no versionado).
# Solo autentica al broker; los nodos se autentican con usuario y contraseña propios (ADR-05 S1).
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
